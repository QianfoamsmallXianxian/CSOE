name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install platform packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Set up Gradle 5.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.4.1'
          validate-wrappers: false

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_SDK_ROOT" -name sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;28.0.3" "cmake;3.10.2.4988404" "ndk;21.4.7075529"

      - name: Build
        working-directory: Android
        run: gradle assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
