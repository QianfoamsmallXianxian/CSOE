name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Repair missing modules
        run: |
          gradle wrapper --gradle-version=8.9 || true
          git clone https://github.com/libsdl-org/SDL.git -b SDL2 SDL2

      # 识别到的平台：CMake, Android/Gradle
      - name: Install platform packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential openjdk-17-jdk

      - name: Set up Gradle 5.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.4.1'

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_SDK_ROOT" -name sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;30.0.2"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake

      - name: Build
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

