name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 依赖清单，每行: 目标路径|仓库地址|分支或标签(可留空)
      DEP_MANIFEST: |
        3rdparty/LuaJIT|https://github.com/LuaJIT/LuaJIT.git|
        3rdparty/nameof|https://github.com/Neargye/nameof.git|v0.10.1
        3rdparty/json|https://github.com/nlohmann/json.git|
        3rdparty/SDL2|https://github.com/libsdl-org/SDL.git|

    steps:
      - name: Clone upstream CSMoE master branch
        run: |
          set -e
          git clone --recursive --depth 1 -b master https://github.com/MoeMod/CSMoE.git work
          rm -rf work/.git
          cd work
          sed -i 's/jcenter()/mavenCentral()/g' Android/build.gradle
          echo '===== submodules in 3rdparty ====='
          ls 3rdparty

      - name: Fetch all declared third-party dependencies
        working-directory: work
        run: |
          set -e
          printf '%s\n' "$DEP_MANIFEST" | while IFS='|' read -r path url ref; do
            [ -z "$path" ] && continue
            if [ -e "$path" ]; then
              echo "[have]  $path"
            else
              echo "[fetch] $path <= $url ${ref:+(ref $ref)}"
              if [ -n "$ref" ]; then
                git clone --depth 1 -b "$ref" "$url" "$path"
              else
                git clone --depth 1 "$url" "$path"
              fi
              rm -rf "$path/.git"
            fi
          done
          echo '===== after fetch ====='
          ls 3rdparty

      - name: Verify required sources
        working-directory: work
        run: |
          set -e
          rc=0
          for d in 3rdparty/LuaJIT 3rdparty/nameof 3rdparty/json 3rdparty/SDL2; do
            if [ -d "$d" ]; then echo "[ok]   $d"; else echo "[MISS] $d"; rc=1; fi
          done
          for f in 3rdparty/luajit-cmake/LuaJIT.cmake 3rdparty/QRCode/src/qrcode.c 3rdparty/LuaJIT/src/luajit_rolling.h; do
            if [ -e "$f" ]; then echo "[ok]   $f"; else echo "[MISS] $f"; rc=1; fi
          done
          if [ "$rc" != "0" ]; then
            echo '::error::required sources missing, see [MISS] above'
            exit 1
          fi

      - name: Generate LuaJIT rolling header (luajit.h)
        working-directory: work/3rdparty/LuaJIT/src
        run: |
          set -e
          test -f luajit_rolling.h
          sed 's/^#error.*$//' luajit_rolling.h > luajit.h
          test -s luajit.h
          echo '----- generated luajit.h (version macros) -----'
          grep -n 'LUAJIT_VERSION' luajit.h

      - name: Set up JDK 8 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK tools
        run: |
          set -e
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip -O tools.zip
          unzip -q tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/tools/bin" >> $GITHUB_PATH

      - name: Install platform build-tools NDK CMake
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-29" "build-tools;30.0.2" "ndk;20.0.5594570" "cmake;3.18.1" > /tmp/sdk.log 2>&1 || { tail -120 /tmp/sdk.log; exit 1; }
          find "$HOME/android-sdk/cmake" -name source.properties -exec sed -i 's/^Pkg.Revision=.*/Pkg.Revision=3.18.1/' {} +
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/20.0.5594570" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk/20.0.5594570" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/android-sdk/ndk/20.0.5594570" >> $GITHUB_ENV

      - name: Set up JDK 11 (for build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download Gradle 6.5
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-6.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-6.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd work/Android
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Show gradle errors
        if: failure()
        run: |
          echo '===== GRADLE LOG TAIL ====='
          tail -200 /tmp/gradle.log || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csmoe-apk
          path: work/Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
